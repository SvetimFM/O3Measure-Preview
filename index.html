<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary Meta Tags -->
    <title>O3Measure - Hand Tracking AR Measuring Tool</title>
    <meta name="title" content="O3Measure - Hand Tracking AR Measuring Tool" />
    <meta name="description" content="Professional WebXR augmented reality measuring tool with hand tracking for Meta Quest devices. Calibrate walls, define objects, and measure your environment with precision." />
    <meta name="keywords" content="WebXR, AR, augmented reality, Meta Quest, hand tracking, measuring tool, spatial computing, VR" />
    <meta name="author" content="O3Measure" />
    <meta name="robots" content="index, follow" />

    <!-- Viewport & Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#15ACCF" />
    <meta name="apple-mobile-web-app-title" content="O3Measure" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://o3measure.app/" />
    <meta property="og:title" content="O3Measure - Hand Tracking AR Measuring Tool" />
    <meta property="og:description" content="Professional WebXR augmented reality measuring tool with hand tracking for Meta Quest devices." />
    <meta property="og:image" content="/icons/icon-512x512.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://o3measure.app/" />
    <meta property="twitter:title" content="O3Measure - Hand Tracking AR Measuring Tool" />
    <meta property="twitter:description" content="Professional WebXR augmented reality measuring tool with hand tracking for Meta Quest devices." />
    <meta property="twitter:image" content="/icons/icon-512x512.png" />

    <!-- WebXR & Performance Optimization -->
    <meta name="xr-spatial-tracking" content="enabled" />
    <meta http-equiv="origin-trial" content="" />

    <!-- Security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), interest-cohort=()" />

    <!-- DNS Prefetch for Performance -->
    <link rel="dns-prefetch" href="https://aframe.io" />
    <link rel="preconnect" href="https://aframe.io" crossorigin />

    <!-- Load A-Frame script -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    
    <!-- Include main CSS -->
    <link rel="stylesheet" href="/src/styles/main.css">
    
    <!-- Preload emoji font for WebXR -->
    <style>
      @font-face {
        font-family: 'emoji';
        src: local('Apple Color Emoji'),
             local('Android Emoji'),
             local('Segoe UI Emoji'),
             local('Noto Color Emoji');
        font-display: swap;
      }
      
      /* Force emoji preloading */
      .emoji-preload {
        position: absolute;
        top: -9999px;
        left: -9999px;
        font-family: 'emoji';
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!-- Symbol/character preloader - hidden from view -->
    <div class="emoji-preload">
      ← ↑ → ↓ ↔ ↕ ↖ ↗ ↘ ↙ ⬅ ⬆ ➡ ⬇ ⬉ ⬊ ⬋ ⬌ ⬍ ⭐ ❗ ✓ ✗ 👁 🚫
    </div>
    
    <!-- AR UI overlay -->
    <div id="overlay-ui" class="ui-overlay">
      <!-- Status indicator -->
      <div class="status" id="status">Loading O3Measure...</div>
      
      <!-- AR button for mobile devices -->
      <button id="ar-button" class="ar-button">Start AR</button>
    </div>
    
    <!-- A-Frame Scene -->
    <a-scene 
      webxr="mode: immersive-ar;
             optionalFeatures: hit-test, dom-overlay, anchors; 
             requiredFeatures: local-floor, hand-tracking; 
             overlayElement: #overlay-ui;
             referenceSpaceType: local-floor;
             matchDeviceSize: true"
      renderer="antialias: true; colorManagement: true; precision: high; foveationLevel: 1"
      loading-screen="enabled: true; dotsColor: #15ACCF; backgroundColor: #000000"
      xr-mode-ui="enabled: true; enterAREnabled: true; XRMode: ar;"      scene-manager basic-scene
      ar-hit-test="target: #reticle; enabled: true">
      
      <!-- A-Frame Assets -->
      <a-assets></a-assets>
      
      <!-- Camera rig with hands -->
      <a-entity id="cameraRig" position="0 0 0">
        <!-- Camera -->
        <a-camera position="0 1.6 0" 
                  look-controls="pointerLockEnabled: false" 
                  wasd-controls="enabled: false">
        </a-camera>
      </a-entity>
      
      <!-- Basic lighting -->
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; intensity: 0.6" position="1 1 1"></a-entity>
               
      <!-- Hand tracking with grab controls -->
      <a-entity id="leftHand" hand-tracking-controls="hand: left;" hand-tracking-grab-controls="hand: left;" obb-collider></a-entity>
      <a-entity id="rightHand" hand-tracking-controls="hand: right;" hand-tracking-grab-controls="hand: right;" obb-collider></a-entity>
      
      <!-- No need for explicit pinch detection, as A-Frame's hand-tracking-controls handles it -->
      
      <!-- Interactive test objects -->
      <a-entity id="interactive-objects" position="0 1.2 -0.5">
        <!-- Test cube -->
        <a-box id="test-cube" 
          position="-0.2 0 0" 
          width="0.1" height="0.1" depth="0.1" 
          color="#FF7700"
          shadow="cast: true"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear" grabbable obb-collider>
        </a-box>
    </a-scene>

    <!-- Script entry point -->
    <script type="module" src="/src/main.js"></script>

    <!-- Service Worker Registration -->
    <script>
      // Register service worker for offline support and performance
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[PWA] Service Worker registered successfully:', registration.scope);

              // Check for updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                console.log('[PWA] Service Worker update found');

                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] New version available! Refresh to update.');
                    // Optionally notify the user about the update
                  }
                });
              });
            })
            .catch((error) => {
              console.warn('[PWA] Service Worker registration failed:', error);
            });
        });
      }

      // Handle PWA installation prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log('[PWA] Install prompt available');
        // You can show a custom install button here if desired
      });

      window.addEventListener('appinstalled', () => {
        console.log('[PWA] App installed successfully');
        deferredPrompt = null;
      });
    </script>
  </body>
</html>
